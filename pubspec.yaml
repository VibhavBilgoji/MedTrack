name: medtrack
description: MedTrack – Smart Medicine Expiry Tracker. A production-grade health-tech Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ───────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Firebase ─────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

  # ── OCR / Camera ─────────────────────────────────────────────
  google_mlkit_text_recognition: ^0.13.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # ── Charts ───────────────────────────────────────────────────
  fl_chart: ^0.69.0

  # ── Local Storage / Offline ───────────────────────────────────
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # ── Notifications ─────────────────────────────────────────────
  flutter_local_notifications: ^17.2.4

  # ── Networking / Utilities ────────────────────────────────────
  connectivity_plus: ^6.1.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.5
  dartz: ^0.10.1

  # ── UI Enhancements ───────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  percent_indicator: ^4.2.3

  # ── Code Generation (runtime) ────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
